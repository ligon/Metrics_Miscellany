[tool.poetry]
name = "metrics-miscellany"
version = "0.3.4"
description = "Miscellaneous code for estimation involving pandas dataframes."
readme = "README.org"
license = "CC-BY-NC-SA-4.0"
authors = ["Ethan Ligon <ligon@berkeley.edu>"]
packages = [{ include = "metrics_miscellany" }]
include = [{ path = "metrics_miscellany/**/*.py", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
numpy = ">=1.25"
pandas = ">=1.5"
scipy = ">=1.9"
datamat = ">=0.2.1"
ipython = ">=8.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
matplotlib = "^3.8"
ruff = "^0.5"
black = "^24.4"
mypy = "^1.10"
statsmodels = "^0.14"
pytest-cov = "^7.1.0"

[tool.poetry.scripts]
metrics-miscellany-version = "metrics_miscellany.gmm:print_version"

[tool.pytest.ini_options]
testpaths = ["metrics_miscellany/test"]
markers = [
  "slow: tests that are comparatively expensive"
]

[tool.black]
target-version = ["py311"]
line-length = 88
extend-exclude = "dist|build|Metrics_Miscellany\\.egg-info"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist", "Metrics_Miscellany.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Everything under metrics_miscellany/ is tangled from
# metrics_miscellany.org, where each section re-imports numpy/pandas so its
# source block stays independently evaluable in the buffer.  Concatenating
# those blocks into one module necessarily produces repeated and
# mid-file imports; that is a property of the literate source, not a defect.
#   I001  unsorted-imports
#   E402  module-import-not-at-top-of-file
#   F811  redefinition of an unused name (the repeated imports)
# F811 would otherwise also flag a genuinely duplicated *definition*, so
# test_no_duplicate_definitions.py guards that case structurally instead.
"metrics_miscellany/**/*.py" = ["I001", "E402", "F811"]

[tool.ruff.lint.isort]
known-third-party = ["datamat", "numpy", "pandas", "scipy"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
allow_redefinition = true
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "metrics_miscellany.test.*"
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["metrics_miscellany"]
# Tests get high coverage trivially because pytest imports them; exclude
# them so the headline number reflects production-code coverage.
omit = ["metrics_miscellany/test/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Treat "always-false" defensive blocks and protocol __repr__/__main__
# blocks as exempt; saves us from carrying coverage pragmas inline.
exclude_also = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
